name: Test acces DGPCI
on:
  push:
    paths: ['.github/workflows/dgpci-test.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test DGPCI
        run: |
          set +e
          {
            echo "data: $(date -u)"
            echo "--- lista statistici 2026 ---"
            curl -sS -m 60 -o list.json -w "HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" \
              -X POST -H 'Content-Type: application/json' \
              -d '{"language":"RO","page":1,"maxrows":40,"category":"statistica","year":2026}' \
              https://dgpci.mai.gov.ro/drpciv-api/readNewsMedia
            head -c 400 list.json; echo
            echo "--- arhiva octombrie 2026 ---"
            curl -sS -m 300 -o a.rar -w "HTTP %{http_code}, %{size_download} bytes, %{time_total}s\n" \
              https://dgpci.mai.gov.ro/assets/uploads/stiri-comunicate/f2482430-d683-11f1-988f-e7b6e58cb6fa.rar
            echo "asteptat: 8580569 bytes"
            sha256sum a.rar
            echo "--- unrar ---"
            sudo apt-get install -y -qq unrar >/dev/null 2>&1 || sudo apt-get install -y -qq unrar-free >/dev/null 2>&1
            unrar l a.rar 2>&1 | head -20 || true
          } > rezultat.txt 2>&1
          cat rezultat.txt
          true
      - name: Publica rezultatul
        run: |
          while IFS= read -r line; do echo "::notice::$line"; done < rezultat.txt

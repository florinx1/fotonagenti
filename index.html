<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Raportare Agenti Foton</title>
<meta name="theme-color" content="#1F3864" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Foton Agenti" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="viz-root">

<header class="app-header">
  <div class="app-header-text">
    <div class="app-header-title" id="appTitle">Raportare Agenti Foton</div>
    <div class="app-header-sub" id="offlineBadge" hidden>Offline &mdash; se salveaza local</div>
  </div>
  <div class="app-header-brands" aria-hidden="true">
    <img src="icons/brand/foton.png" alt="Foton" class="brand-badge" />
    <img src="icons/brand/intercargo.png" alt="Inter Cargo" class="brand-badge" />
  </div>
</header>

<main id="view-form" class="view">
  <form id="entryForm" autocomplete="off">
    <div class="field">
      <label for="f_agent">Agent *</label>
      <select id="f_agent" required></select>
    </div>

    <div class="field">
      <label for="f_date">Data discutiei *</label>
      <input type="date" id="f_date" required />
    </div>

    <div class="field">
      <label for="f_dealer">Dealer / Firma *</label>
      <input type="text" id="f_dealer" placeholder="ex: Auto Exemplu SRL" required />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f_contact">Persoana contact</label>
        <input type="text" id="f_contact" placeholder="ex: Ion Popescu" />
      </div>
      <div class="field">
        <label for="f_telefon">Telefon</label>
        <input type="tel" id="f_telefon" placeholder="07xx xxx xxx" />
      </div>
    </div>

    <div class="field">
      <label for="f_email">Email</label>
      <input type="email" id="f_email" placeholder="nume@firma.ro" />
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f_judet">Judet *</label>
        <select id="f_judet" required></select>
      </div>
      <div class="field">
        <label for="f_localitate">Localitate</label>
        <input type="text" id="f_localitate" placeholder="ex: Cluj-Napoca" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="f_status">Status discutie *</label>
        <select id="f_status" required></select>
      </div>
      <div class="field">
        <label for="f_potential">Potential</label>
        <select id="f_potential"></select>
      </div>
    </div>

    <div class="field">
      <label for="f_next_action">Urmatoarea actiune</label>
      <input type="text" id="f_next_action" placeholder="ex: Trimitere oferta" />
    </div>

    <div class="field">
      <label for="f_next_date">Data urmatoarei actiuni</label>
      <input type="date" id="f_next_date" />
    </div>

    <div class="field">
      <label for="f_obs">Observatii</label>
      <textarea id="f_obs" rows="3" placeholder="Detalii relevante din discutie..."></textarea>
    </div>

    <button type="submit" class="btn-primary" id="submitBtn">Salveaza discutia</button>
    <div id="formMsg" class="form-msg" role="status" aria-live="polite"></div>
  </form>
</main>

<main id="view-report" class="view" hidden>
  <div class="report-toolbar">
    <button id="refreshBtn" class="btn-secondary" type="button">Reincarca raportul</button>
    <span id="reportUpdated" class="muted-text"></span>
  </div>

  <section class="kpi-grid" id="kpiGrid" aria-label="Indicatori principali"></section>

  <section class="card">
    <h2>Status dealeri</h2>
    <div id="statusBars" class="bar-list"></div>
  </section>

  <section class="card">
    <h2>Activitate agenti</h2>
    <div id="agentBars" class="bar-list"></div>
  </section>

  <section class="card">
    <h2>Distributie geografica (top judete)</h2>
    <div id="geoBars" class="bar-list"></div>
  </section>

  <section class="card">
    <h2>Actiuni restante</h2>
    <div id="restanteList" class="restante-list"></div>
  </section>
</main>

<nav class="tab-bar" aria-label="Navigare">
  <button class="tab-btn active" id="tabFormBtn" type="button">
    <span class="tab-icon" aria-hidden="true">＋</span>
    <span>Adauga</span>
  </button>
  <button class="tab-btn" id="tabReportBtn" type="button">
    <span class="tab-icon" aria-hidden="true">▤</span>
    <span>Raport</span>
  </button>
</nav>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
